[project]
name = "softvoice"
version = "0.1.0"
description = "On-device voice in and out for Claude Code and Codex: replies read aloud, push-to-talk and dictation, nothing leaves your Mac"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude-code", "codex", "text-to-speech", "speech-to-text", "voice", "dictation", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
authors = [
    { name = "SPra03", email = "11s11p11sp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "parakeet-mlx>=0.5.3",
    "pocket-tts>=4.0.1",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "rumps>=0.4.0",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/SPra03/softvoice"
Issues = "https://github.com/SPra03/softvoice/issues"

[project.scripts]
softvoice = "softvoice.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
