name: release

# Tag a commit `vX.Y.Z` (matching the version in pyproject.toml) and push the tag:
# this builds the wheel, publishes it to PyPI through trusted publishing (no token
# stored anywhere) and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: write  # the GitHub release
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish --trusted-publishing always
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
